    <meta name="robots" content="index, follow" />

    <!-- PWA: Apple -->
    <!-- ホーム画面から起動したらブラウザのUIを使わず全画面をアプリに使う。
         apple- 付きは iOS 用の旧指定で、標準名は mobile-web-app-capable。
         標準名が無いと Chrome が非推奨警告を出し、環境によってはブラウザの
         枠が残るため両方書く。 -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="地本イベント(非公式)" />
    <!-- 既定（陸上）。選択中の配色へ shared/bootTheme.cjs が差し替える -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- favicon（宣言が無いとブラウザが /favicon.ico を探して毎回404になる） -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />

    <!-- テーマカラー（ステータスバーの色）はここに書かない。
         利用者が選んだ配色（陸/海/空）に合わせる必要があり、静的に書くと
         「HTMLの既定色 → JSが上書き」で起動のたびに色が変わって見える。
         <head> 先頭へ注入される shared/bootTheme.cjs が初回描画前に生成する
         （同じスクリプトが manifest と apple-touch-icon も配色ごとに差し替える）。 -->

    <!-- 起動時のちらつき防止（FOUC対策・JS実行前から適用）
         グローバルCSSは main.jsx の injectGlobalStyles() でJS実行時に注入されるため、
         それまでの間に素のHTML（特に #root 外の SEO 用フッター）が画面に一瞬出るのを防ぐ。
         空の #root をビューポート高にしてアプリ描画前の余白を確保する。
         #seo-footer は内部リンク巡回のため DOM には残すが、利用者には見えないよう
         視覚的に隠す（off-screen）。リンクは HTML 内に存在するためクローラーは辿れる。

         ※ 背景色はここに書かない。ライト色を固定で置くと、ダーク利用者が
           コールドロードのたびに白い画面を経由する。テーマ確定は <head> 先頭へ
           注入される shared/bootTheme.cjs（vite.config.js の bootThemeInject）が
           初回描画前に行う。 -->
    <style>
      html, body { margin: 0; }
      /* ページ自体はスクロールさせない（アプリ内の領域だけスクロール）。
         モバイルの下部ラバーバンド／余計な動きを防ぐ（JS前から適用）。 */
      html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
      body { position: fixed; inset: 0; width: 100%; }
      #root { min-height: 100vh; min-height: 100dvh; }
      /* SEO用フッターを画面から隠す（DOM・内部リンクは保持＝クロール可能） */
      #seo-footer {
        position: absolute !important;
        width: 1px; height: 1px;
        padding: 0; margin: -1px;
        overflow: hidden; clip: rect(0, 0, 0, 0);
        white-space: nowrap; border: 0;
      }
    </style>
