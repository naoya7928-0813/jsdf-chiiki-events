name: スクレイピング & データ更新

on:
  # 日本時間 8:00 / 12:00 / 18:00 に自動実行
  # UTC 換算: 23:00(前日) / 03:00 / 09:00
  schedule:
    - cron: '0 23 * * *'   # 日本時間 08:00
    - cron: '0 3 * * *'    # 日本時間 12:00
    - cron: '0 9 * * *'    # 日本時間 18:00

  # GitHub Actions の UI から手動実行も可能
  workflow_dispatch:

jobs:
  scrape:
    name: イベントデータ取得
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write

    steps:
      # ── リポジトリをチェックアウト ──────────────────────────
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      # ── Node.js のセットアップ ───────────────────────────────
      - name: Node.js 22 をセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ── scraper の依存パッケージをインストール ───────────────
      - name: scraper の依存パッケージをインストール
        working-directory: scraper
        run: npm ci

      # ── Playwright 用 Chromium をインストール ────────────────
      - name: Playwright Chromium をインストール
        working-directory: scraper
        run: npx playwright install chromium --with-deps

      # ── スクレイピング実行 ────────────────────────────────────
      - name: イベントデータをスクレイピング
        working-directory: scraper
        run: node index.js
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      # ── 変更があればコミット & プッシュ ──────────────────────
      - name: 変更をコミット & プッシュ
        id: commit
        run: |
          git config core.autocrlf false
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add public/data/events.json public/events.html public/sitemap.xml

          STATUS=$(git status --porcelain public/data/events.json public/events.html public/sitemap.xml)
          if [ -z "$STATUS" ]; then
            echo "データに変更がありませんでした。コミットをスキップします。"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: update events data [skip ci]"
            git pull --rebase
            git push || (git pull --rebase && git push)
            echo "events.json を更新しました。"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # ── Vercel に本番デプロイ ─────────────────────────────
      - name: Vercel に本番デプロイ
        if: steps.commit.outputs.changed == 'true'
        run: npx vercel --prod --token ${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # ── ntfy.sh でプッシュ通知送信 ────────────────────────
      - name: プッシュ通知を送信
        if: steps.commit.outputs.changed == 'true'
        run: |
          cat > /tmp/check_notify.js << 'JSEOF'
          'use strict';
          const { execSync } = require('child_process');
          const fs            = require('fs');

          const curr = JSON.parse(fs.readFileSync('./public/data/events.json', 'utf8'));

          let prev = { updatedAt: null };
          try {
            const raw = execSync('git show HEAD~1:public/data/events.json').toString();
            prev = JSON.parse(raw);
          } catch {
            console.log('[通知] 前回データなし（初回コミット）');
          }

          console.log('[通知判定]');
          console.log('  前回 updatedAt :', prev.updatedAt ?? '(なし)');
          console.log('  今回 updatedAt :', curr.updatedAt);

          if (prev.updatedAt && prev.updatedAt === curr.updatedAt) {
            console.log('  → スキップ: updatedAt 変化なし');
            process.exit(0);
          }

          const ALL_PREFS = Object.keys(curr).filter(k => Array.isArray(curr[k]));
          const prevIds  = new Set(ALL_PREFS.flatMap(p => (prev[p] || []).map(e => e.id)));
          const currAll  = ALL_PREFS.flatMap(p => curr[p] || []);
          const newItems = currAll.filter(e => !prevIds.has(e.id));

          console.log('  全イベント数 :', currAll.length, '件');
          console.log('  新着件数     :', newItems.length, '件');
          newItems.forEach(e => console.log('    新着:', e.id, e.title));

          if (newItems.length === 0) {
            console.log('  → スキップ: 新着イベントなし');
            process.exit(0);
          }

          fs.writeFileSync('/tmp/notify_count.txt', String(newItems.length));
          JSEOF

          node /tmp/check_notify.js

          if [ -f /tmp/notify_count.txt ]; then
            COUNT=$(cat /tmp/notify_count.txt)
            curl -s \
              -H "Title: 自衛隊地本イベント情報 新着" \
              -H "Tags: mega,jp" \
              -H "Priority: default" \
              -d "新着イベントが${COUNT}件追加されました。アプリを開いて確認してください。" \
              https://ntfy.sh/jsdf-chiiki-events-7928
            echo "[通知] ntfy 送信完了（新着 ${COUNT}件）"
          else
            echo "[通知] 送信スキップ"
          fi

      # ── スクレイプ失敗を管理者に通知 ──────────────────────
      - name: スクレイプ失敗を管理者に通知
        if: failure()
        run: |
          curl -s \
            -H "Title: ⚠️ スクレイピング失敗" \
            -H "Tags: warning" \
            -H "Priority: high" \
            -d "スクレイピングジョブが失敗しました。GitHub Actions のログを確認してください。 https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            https://ntfy.sh/${{ secrets.NTFY_ADMIN_TOPIC }}
