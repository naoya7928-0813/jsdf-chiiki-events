name: スクレイピング & データ更新

on:
  # 日本時間 8:00 / 12:00 / 18:00 に自動実行（1日3回）
  # UTC 換算: 23:00(前日) / 03:00 / 09:00
  schedule:
    - cron: '0 23 * * *'   # 日本時間 08:00
    - cron: '0 3 * * *'    # 日本時間 12:00
    - cron: '0 9 * * *'    # 日本時間 18:00

  # GitHub Actions の UI から手動実行も可能
  workflow_dispatch:

jobs:
  scrape:
    name: イベントデータ取得
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      # ── リポジトリをチェックアウト ──────────────────────────
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      # ── Node.js のセットアップ ───────────────────────────────
      - name: Node.js 22 をセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ── scraper の依存パッケージをインストール ───────────────
      - name: scraper の依存パッケージをインストール
        working-directory: scraper
        run: npm ci

      # ── OCRキャッシュを復元（git管理外・大容量対応） ────────────
      - name: OCRキャッシュを復元
        uses: actions/cache@v4
        with:
          path: scraper/ocr-cache.json
          key: ocr-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            ocr-cache-${{ runner.os }}-

      # ── Playwright Chromium バイナリをキャッシュ ─────────────
      - name: Playwright Chromium キャッシュを復元
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('scraper/package-lock.json') }}

      # ── Tesseract OCR + poppler-utils をインストール ────────────
      - name: Tesseract OCR + poppler-utils をインストール
        run: sudo apt-get install -y tesseract-ocr tesseract-ocr-jpn poppler-utils

      # ── Playwright 用 Chromium をインストール ────────────────
      - name: Playwright Chromium をインストール
        working-directory: scraper
        run: npx playwright install chromium --with-deps

      # ── スクレイピング実行 ────────────────────────────────────
      - name: イベントデータをスクレイピング
        working-directory: scraper
        run: node index.js
        env:
          GROQ_API_KEY:     ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY:   ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY:  ${{ secrets.MISTRAL_API_KEY }}
          SITE_URL:         ${{ secrets.SITE_URL }}
          NOTIFY_SECRET:    ${{ secrets.NOTIFY_SECRET }}

      # ── 変更があればコミット & プッシュ ──────────────────────
      - name: 変更をコミット & プッシュ
        id: commit
        run: |
          git config core.autocrlf false
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add public/data/events.json public/events.html public/events/ public/sitemap.xml

          EVENTS_STATUS=$(git status --porcelain public/data/events.json public/events.html public/sitemap.xml)

          if [ -z "$EVENTS_STATUS" ]; then
            echo "データに変更がありませんでした。コミットをスキップします。"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: update events data [skip ci]"
            git pull --rebase
            git push || (git pull --rebase && git push)
            echo "events.json を更新しました。"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # ── Vercel に本番デプロイ ─────────────────────────────
      - name: Vercel に本番デプロイ
        if: steps.commit.outputs.changed == 'true'
        run: npx vercel --prod --token ${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # ── ntfy.sh でプッシュ通知送信 ────────────────────────
      - name: CDN 伝播待機（Vercel エッジに反映されるまで）
        if: steps.commit.outputs.changed == 'true'
        run: sleep 60

      - name: プッシュ通知を送信
        if: steps.commit.outputs.changed == 'true'
        run: |
          cat > /tmp/check_notify.js << 'JSEOF'
          'use strict';
          const { execSync } = require('child_process');
          const fs            = require('fs');

          const PREF_TO_REGION = {
            sapporo:'hokkaido', asahikawa:'hokkaido', obihiro:'hokkaido', hakodate:'hokkaido',
            aomori:'tohoku', iwate:'tohoku', miyagi:'tohoku', akita:'tohoku', yamagata:'tohoku', fukushima:'tohoku',
            kanagawa:'kanto', tokyo:'kanto', saitama:'kanto', gunma:'kanto', tochigi:'kanto', ibaraki:'kanto', chiba:'kanto',
            niigata:'chubu', toyama:'chubu', ishikawa:'chubu', fukui:'chubu', yamanashi:'chubu', nagano:'chubu', gifu:'chubu', shizuoka:'chubu', aichi:'chubu',
            mie:'kinki', shiga:'kinki', kyoto:'kinki', osaka:'kinki', hyogo:'kinki', nara:'kinki', wakayama:'kinki',
            tokushima:'shikoku', kagawa:'shikoku', ehime:'shikoku', kochi:'shikoku',
            tottori:'chugoku', shimane:'chugoku', okayama:'chugoku', hiroshima:'chugoku', yamaguchi:'chugoku',
            fukuoka:'kyushu', saga:'kyushu', nagasaki:'kyushu', kumamoto:'kyushu', oita:'kyushu', miyazaki:'kyushu', kagoshima:'kyushu', okinawa:'kyushu',
          };
          const REGION_LABELS = {
            hokkaido:'北海道', tohoku:'東北', kanto:'関東', chubu:'中部',
            kinki:'近畿', chugoku:'中国', shikoku:'四国', kyushu:'九州・沖縄',
          };

          const curr = JSON.parse(fs.readFileSync('./public/data/events.json', 'utf8'));

          let prev = { updatedAt: null };
          try {
            const raw = execSync('git show HEAD~1:public/data/events.json').toString();
            prev = JSON.parse(raw);
          } catch {
            console.log('[通知] 前回データなし（初回コミット）');
          }

          console.log('[通知判定]');
          console.log('  前回 updatedAt :', prev.updatedAt ?? '(なし)');
          console.log('  今回 updatedAt :', curr.updatedAt);

          if (prev.updatedAt && prev.updatedAt === curr.updatedAt) {
            console.log('  → スキップ: updatedAt 変化なし');
            process.exit(0);
          }

          const ALL_PREFS = Object.keys(curr).filter(k => Array.isArray(curr[k]));
          const prevIds   = new Set(ALL_PREFS.flatMap(p => (prev[p] || []).map(e => e.id)));
          const newItems  = ALL_PREFS.flatMap(p =>
            (curr[p] || []).filter(e =>
              !prevIds.has(e.id) && e.source_type !== 'office_notice'
            ).map(e => ({ ...e, _pref: p }))
          );

          console.log('  全イベント数 :', ALL_PREFS.flatMap(p => curr[p] || []).length, '件');
          console.log('  新着件数     :', newItems.length, '件');
          newItems.forEach(e => console.log('    新着:', e._pref, e.id, e.title));

          if (newItems.length === 0) {
            console.log('  → スキップ: 新着イベントなし');
            process.exit(0);
          }

          // 地区別にグループ化
          const byRegion = {};
          for (const e of newItems) {
            const region = PREF_TO_REGION[e._pref] || 'other';
            if (!byRegion[region]) byRegion[region] = [];
            byRegion[region].push(e);
          }

          const regionNames = Object.keys(byRegion)
            .map(r => REGION_LABELS[r] || r)
            .join('・');

          fs.writeFileSync('/tmp/notify_data.json', JSON.stringify({
            total: newItems.length,
            regionNames,
            byRegion: Object.fromEntries(
              Object.entries(byRegion).map(([r, evs]) => [r, {
                label: REGION_LABELS[r] || r,
                count: evs.length,
                sample: evs[0].title,
              }])
            ),
          }));
          JSEOF

          node /tmp/check_notify.js

          if [ -f /tmp/notify_data.json ]; then
            TOTAL=$(node -p "require('/tmp/notify_data.json').total")
            REGION_NAMES=$(node -p "require('/tmp/notify_data.json').regionNames")

            # 全地区トピックへ送信
            curl -s \
              -H "Title: 自衛隊地本イベント情報 新着" \
              -H "Tags: mega,jp" \
              -H "Priority: default" \
              -d "新着イベントが${TOTAL}件追加されました（${REGION_NAMES}）。アプリを確認してください。" \
              https://ntfy.sh/${{ secrets.NTFY_TOPIC }}
            echo "[通知] 全地区送信完了（新着 ${TOTAL}件 / ${REGION_NAMES}）"

            # 地区別トピックへ送信
            node -e "
              const d = require('/tmp/notify_data.json');
              for (const [id, r] of Object.entries(d.byRegion)) {
                process.stdout.write(id + '\t' + r.label + '\t' + r.count + '\t' + r.sample + '\n');
              }
            " | while IFS=$'\t' read -r REGION_ID REGION_LABEL COUNT SAMPLE; do
              curl -s \
                -H "Title: 自衛隊地本イベント情報 新着（${REGION_LABEL}）" \
                -H "Tags: mega,jp" \
                -H "Priority: default" \
                -d "${REGION_LABEL}に新着${COUNT}件（${SAMPLE}）追加されました。" \
                https://ntfy.sh/${{ secrets.NTFY_TOPIC }}-${REGION_ID}
              echo "[通知] ${REGION_LABEL}送信完了（${COUNT}件）"
            done
          else
            echo "[通知] 送信スキップ"
          fi

      # ── スクレイプ失敗を管理者に通知 ──────────────────────
      - name: スクレイプ失敗を管理者に通知
        if: failure()
        run: |
          curl -s \
            -H "Title: ⚠️ スクレイピング失敗" \
            -H "Tags: warning" \
            -H "Priority: high" \
            -H "Content-Type: text/plain; charset=utf-8" \
            -d "スクレイピングジョブが失敗しました。GitHub Actions のログを確認してください。 https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            https://ntfy.sh/${{ secrets.NTFY_ADMIN_TOPIC }}
