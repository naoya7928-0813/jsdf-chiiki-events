name: スクレイピング & データ更新

on:
  # 日本時間 8:00 / 12:00 / 18:00 に自動実行
  # UTC 換算: 23:00(前日) / 03:00 / 09:00
  schedule:
    - cron: '0 23 * * *'   # 日本時間 08:00
    - cron: '0 3 * * *'    # 日本時間 12:00
    - cron: '0 9 * * *'    # 日本時間 18:00

  # GitHub Actions の UI から手動実行も可能
  workflow_dispatch:

jobs:
  scrape:
    name: イベントデータ取得
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write   # events.json をコミット・プッシュするために必要

    steps:
      # ── リポジトリをチェックアウト ──────────────────────────
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      # ── Node.js のセットアップ ───────────────────────────────
      - name: Node.js 24 をセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # ── scraper の依存パッケージをインストール ───────────────
      # scraper/package.json は本体の package.json とは独立
      - name: scraper の依存パッケージをインストール
        working-directory: scraper
        run: npm ci

      # ── Playwright 用 Chromium とシステム依存ライブラリをインストール ──
      # --with-deps でフォント・libglib等のLinux依存も自動解決
      - name: Playwright Chromium をインストール
        working-directory: scraper
        run: npx playwright install chromium --with-deps

      # ── スクレイピング実行 ────────────────────────────────────
      # 失敗してもワークフローを止めない（|| true）ようにしつつ、
      # 後続ステップで変更有無を確認する
      - name: イベントデータをスクレイピング
        working-directory: scraper
        run: node index.js
        env:
          # Playwrightがヘッドレスで動作するよう環境変数を設定
          DISPLAY: ''

      # ── 変更があればコミット & プッシュ ──────────────────────
      - name: 変更をコミット & プッシュ
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add public/data/events.json

          # ステージングされた変更がなければスキップ
          if git diff --staged --quiet; then
            echo "データに変更がありませんでした。コミットをスキップします。"
          else
            git commit -m "chore: update events data [skip ci]"
            git push
            echo "events.json を更新しました。"
          fi
