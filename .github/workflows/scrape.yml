name: スクレイピング & データ更新

on:
  # 日本時間 8:00 / 12:00 / 18:00 に自動実行
  # UTC 換算: 23:00(前日) / 03:00 / 09:00
  schedule:
    - cron: '0 23 * * *'   # 日本時間 08:00
    - cron: '0 3 * * *'    # 日本時間 12:00
    - cron: '0 9 * * *'    # 日本時間 18:00

  # scraper コードの変更時にも自動実行
  push:
    paths:
      - 'scraper/**'

  # GitHub Actions の UI から手動実行も可能
  workflow_dispatch:

jobs:
  scrape:
    name: イベントデータ取得
    runs-on: self-hosted      # 自宅 PC のセルフホストランナー（住所IPでCloudflare通過）
    timeout-minutes: 15

    permissions:
      contents: write

    steps:
      # ── リポジトリをチェックアウト ──────────────────────────
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      # ── Node.js のセットアップ ───────────────────────────────
      - name: Node.js 20 をセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── scraper の依存パッケージをインストール ───────────────
      - name: scraper の依存パッケージをインストール
        working-directory: scraper
        run: npm ci
        shell: powershell

      # ── Playwright 用 Chromium をインストール ────────────────
      - name: Playwright Chromium をインストール
        working-directory: scraper
        run: npx playwright install chromium
        shell: powershell

      # ── スクレイピング実行 ────────────────────────────────────
      - name: イベントデータをスクレイピング
        working-directory: scraper
        run: node index.js
        shell: powershell
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      # ── 変更があればコミット & プッシュ ──────────────────────
      - name: 変更をコミット & プッシュ
        id: commit
        shell: powershell
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add public/data/events.json

          git diff --staged --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Output "データに変更がありませんでした。コミットをスキップします。"
            "changed=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            git commit -m "chore: update events data [skip ci]"
            git pull --rebase
            git push
            Write-Output "events.json を更新しました。"
            "changed=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      # ── Vercel に本番デプロイ ─────────────────────────────
      - name: Vercel に本番デプロイ
        if: steps.commit.outputs.changed == 'true'
        run: npx vercel --prod --token ${{ secrets.VERCEL_TOKEN }}
        shell: powershell
        env:
          VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # ── ntfy.sh でプッシュ通知送信 ────────────────────────
      - name: プッシュ通知を送信
        if: steps.commit.outputs.changed == 'true'
        shell: powershell
        run: |
          $checkScript = @'
          'use strict';
          const { execSync } = require('child_process');
          const fs            = require('fs');

          const curr = JSON.parse(fs.readFileSync('./public/data/events.json', 'utf8'));

          let prev = { updatedAt: null };
          try {
            const raw = execSync('git show HEAD~1:public/data/events.json').toString();
            prev = JSON.parse(raw);
          } catch {
            console.log('[通知] 前回データなし（初回コミット）');
          }

          console.log('[通知判定]');
          console.log('  前回 updatedAt :', prev.updatedAt ?? '(なし)');
          console.log('  今回 updatedAt :', curr.updatedAt);

          if (prev.updatedAt && prev.updatedAt === curr.updatedAt) {
            console.log('  → スキップ: updatedAt 変化なし');
            process.exit(0);
          }

          const PREFS = ['kanagawa','tokyo','saitama','gunma','tochigi','ibaraki','chiba'];
          const prevIds  = new Set(PREFS.flatMap(p => (prev[p] || []).map(e => e.id)));
          const currAll  = PREFS.flatMap(p => curr[p] || []);
          const newItems = currAll.filter(e => !prevIds.has(e.id));

          console.log('  全イベント数 :', currAll.length, '件');
          console.log('  新着件数     :', newItems.length, '件');
          newItems.forEach(e => console.log('    新着:', e.id, e.title));

          if (newItems.length === 0) {
            console.log('  → スキップ: 新着イベントなし');
            process.exit(0);
          }

          const jstNow = new Date(Date.now() + 9 * 3600 * 1000);
          const h = jstNow.getUTCHours();
          const m = jstNow.getUTCMinutes();
          const total = h * 60 + m;
          const windows = [8 * 60, 12 * 60, 18 * 60];
          const inWin = windows.some(w => Math.abs(total - w) <= 30);

          if (!inWin) {
            console.log('  → スキップ: 通知ウィンドウ外');
            process.exit(0);
          }

          fs.writeFileSync(process.env.TEMP + '\\notify_count.txt', String(newItems.length));
          '@

          $tempJs = "$env:TEMP\check_notify.js"
          $checkScript | Out-File -FilePath $tempJs -Encoding utf8
          node $tempJs

          $notifyFile = "$env:TEMP\notify_count.txt"
          if (Test-Path $notifyFile) {
            $count = Get-Content $notifyFile
            Invoke-RestMethod `
              -Uri "https://ntfy.sh/jsdf-chiiki-events-7928" `
              -Method Post `
              -Body "新着イベントが${count}件追加されました。アプリを開いて確認してください。" `
              -Headers @{ Title = "自衛隊地本イベント情報 新着"; Tags = "mega,jp"; Priority = "default" }
            Write-Output "[通知] ntfy 送信完了（新着 ${count}件）"
          } else {
            Write-Output "[通知] 送信スキップ"
          }
