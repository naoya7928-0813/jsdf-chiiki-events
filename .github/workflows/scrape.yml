name: スクレイピング & データ更新

on:
  # 【通知は必ず 08:00 / 12:00 / 18:00(JST) のスロットで送る設計】
  #   通知ステップ内で「目標スロットまで待ってから送信」する。そのため
  #   スクレイプはスロットより十分前に開始し、スロット到達前に終わらせておく。
  #
  #   ■ 間に合わなかった場合（カットオフ。2026-09-02 導入）
  #     以前は最後まで走らせていたため、OCR や LLM が長引くと 09:32 や 12:40 と
  #     いった中途半端な時刻に配信されていた。現在は **スロットの6分前で
  #     スクレイプを打ち切り、そこまでに取れた分で公開する**。
  #     打ち切りの判断は shared/scrapeDeadline.cjs（cron→スロットの対応もここが唯一の出どころ）。
  #     ・取得を見送った地本は前回データを引き継ぐ（イベントは消えない）
  #     ・打ち切りは地本の切れ目・案内所巡回・OCR補完・LLM再検査の各所で効く
  #     ・毎回同じ後半が切られないよう、地本の開始位置は実行ごとにずらす
  #     ・起動が遅すぎて使える時間が15分未満なら**締切を外して最後まで走らせる**
  #       （打ち切っても更新できる地本がわずかで、定刻を守る意味がないため）
  #
  #   ■ 開始時刻の根拠（2026-08-30 に Actions API の実測で再計算）
  #     実行時間: ジョブ全体で 61.6 / 62.3 / 63.4 分（直近3回）。
  #       内訳 = 準備40秒 + スクレイプ本体 約60分 + 検査・commit・デプロイ・CDN待機 約3分。
  #       LLM（段1整形・段3再検査）を挟んでも所要はほぼ変わらない
  #       （導入前 62.5 / 62.7 / 63.6 分）。キャッシュ済みは呼ばず、段3は1実行30件上限のため。
  #     起動遅延: GitHub のスケジュールは定刻に起動しない。実測（直近30回）で
  #       最小17分・中央値66分・p75 122分。まれに数時間ずれる（GitHub側の混雑）。
  #     → 必要な余裕 = 実行 64分 + 吸収したい遅延。**スロットの147分前**に開始すると
  #       83分の遅延まで「打ち切りなしで」定刻どおり通知でき、実測30回中20回（67%）を
  #       カバーする。これを超えて遅れた回は、カットオフが効いて取れた分だけを定刻に出す。
  #     分は :00 だと GitHub 側の遅延が最も大きいため :33 にずらす（混雑回避）。
  #
  #   開始(JST)  → 約64分で完了 → スロットまで待機(約83分) → 通知
  #   05:33      → 約06:37        → 08:00 に送信
  #   09:33      → 約10:37        → 12:00 に送信
  #   15:33      → 約16:37        → 18:00 に送信
  #   ⚠ cron を変えたら shared/scrapeDeadline.cjs の SLOTS も直すこと
  #     （shared/scrapeDeadline.test.cjs がこのファイルを読んでズレを検出する）
  schedule:
    - cron: '33 20 * * *'  # JST 05:33 開始 → 通知 08:00
    - cron: '33 0 * * *'   # JST 09:33 開始 → 通知 12:00
    - cron: '33 6 * * *'   # JST 15:33 開始 → 通知 18:00

  # GitHub Actions の UI から手動実行も可能
  workflow_dispatch:
    inputs:
      hq_explore_prefs:
        description: 'HQ探索を行う地本（カンマ区切りpref。例: kagawa,ehime,fukuoka）。未指定なら通常のローテーション'
        required: false
        default: ''
      hq_explore_timeout_min:
        description: 'HQ探索の時間上限（分）。未指定なら25分'
        required: false
        default: ''

# ── 同時実行防止 ──────────────────────────────────────────────
# 定期(schedule 3種)と手動(workflow_dispatch)は同じ events.json / 静的HTML /
# geocode-cache / master / Vercel本番 を更新する。1本の実行が約60分以上かかるため、
# 重なると同時 commit/push（non-fast-forward）や二重デプロイ・二重通知の恐れがある。
#   group: ブランチや trigger に依存しない固定文字列にする（${{ github.ref }} 等を
#          入れると枠が分かれて同時実行を許してしまうため入れない）。
#   cancel-in-progress: false … 実行中ジョブは絶対に中断しない（commit/rebase/push/
#          deploy/通知の途中でキャンセルしない）。後から来たジョブは待機列に入る。
# データを変更しない PR Check(pr-check.yml) は別グループのため巻き込まれない。
concurrency:
  group: scrape-data-update
  cancel-in-progress: false

jobs:
  scrape:
    name: イベントデータ取得
    runs-on: ubuntu-latest
    # スクレイプ(約63分) + 目標スロットまでの待機(最大約93分) を見込んで上限を延ばす
    # 実行 約64分 + 目標スロットまでの待機 最大約83分 = 約147分。
    # 余裕を持たせて 180 分（従来 130 分のままだと待機中に打ち切られ通知できない）
    timeout-minutes: 180

    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      # ── リポジトリをチェックアウト ──────────────────────────
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v5

      # ── Node.js のセットアップ ───────────────────────────────
      - name: Node.js 22 をセットアップ
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      # ── Python OCR（RapidOCR）のセットアップ ───────────────────
      - name: Python 3.11 をセットアップ
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scraper/requirements-ocr.txt

      # ── 公開URLの確認（設定の直し忘れを知らせるだけ） ──────────────
      # このワークフローは静的ページ・sitemap を生成して**コミットする**ため、
      # SITE_URL（シークレット）に古いドメインが残っていると移行が巻き戻りかねない。
      # 実害は siteUrl() 側で塞いである（移行元のドメインは採用しない）ので、
      # ここはシークレットの更新漏れを警告するだけでジョブは落とさない
      # （落とすとスクレイプが止まり、データが更新されなくなるほうが害が大きい）。
      - name: 公開URLの確認
        run: node scripts/check-site-url.mjs
        env:
          SITE_URL: ${{ secrets.SITE_URL }}

      # ── scraper の依存パッケージをインストール ───────────────
      - name: scraper の依存パッケージをインストール
        working-directory: scraper
        run: npm ci

      - name: RapidOCR をインストール
        continue-on-error: true
        run: python -m pip install -r scraper/requirements-ocr.txt

      # ── OCRキャッシュを復元（git管理外・大容量対応） ────────────
      - name: OCRキャッシュを復元
        uses: actions/cache@v5
        with:
          path: scraper/ocr-cache.json
          key: ocr-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            ocr-cache-${{ runner.os }}-

      # ── LLMキャッシュを復元（段1〜3の呼び出し結果。クォータ節約） ──
      - name: LLMキャッシュを復元
        uses: actions/cache@v5
        with:
          path: scraper/llm-cache.json
          key: llm-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            llm-cache-${{ runner.os }}-

      # ── Playwright Chromium バイナリをキャッシュ ─────────────
      - name: Playwright Chromium キャッシュを復元
        id: pw-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('scraper/package-lock.json') }}

      # ── Tesseract OCR + poppler-utils をインストール ────────────
      - name: Tesseract OCR + poppler-utils をインストール
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-jpn poppler-utils

      # ── Playwright 用 Chromium をインストール ────────────────
      - name: Playwright Chromium をインストール
        working-directory: scraper
        run: npx playwright install chromium --with-deps

      # ── スクレイパーのスモークテスト ──────────────────────────
      # 2026-07-07 に import 漏れ（ReferenceError）が本番実行で初めて露見し
      # 定期スクレイプが全失敗した再発防止。--mock は HTTP アクセスなしで
      # writeOutput（整形・検疫・出力）まで実行するため、構文エラーに加えて
      # 実行時の未定義参照も本スクレイプ前に検出できる。
      - name: スクレイパーのスモークテスト（構文＋モック実行）
        run: |
          echo "STAGE=smoke" >> "$GITHUB_ENV"
          node --check scraper/index.js
          node scraper/index.js --mock
          # モック出力が実データ（前回データ維持・PREV_EVENTS の基準）を
          # 汚さないよう、書き出されたファイルを復元する
          git checkout -- public/ scraper/geocode-cache.json
          rm -f scraper/push-payload.json

      # ── スクレイピング実行 ────────────────────────────────────
      - name: イベントデータをスクレイピング
        working-directory: scraper
        run: |
          echo "STAGE=scrape" >> "$GITHUB_ENV"
          node index.js
        env:
          # 配信スロット（08:00/12:00/18:00 JST）に間に合わせるための打ち切り。
          # cron からスロットと締切を決める（shared/scrapeDeadline.cjs）。
          # 手動実行では空になり、締切なしで最後まで走る。
          SCRAPE_SCHEDULE:  ${{ github.event.schedule }}
          GROQ_API_KEY:     ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY:   ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY:  ${{ secrets.MISTRAL_API_KEY }}
          OCR_SPACE_API_KEY: ${{ secrets.OCR_SPACE_API_KEY }}
          SITE_URL:         ${{ secrets.SITE_URL }}
          NOTIFY_SECRET:    ${{ secrets.NOTIFY_SECRET }}
          HQ_EXPLORE_PREFS:       ${{ github.event.inputs.hq_explore_prefs || '' }}
          HQ_EXPLORE_TIMEOUT_MIN: ${{ github.event.inputs.hq_explore_timeout_min || '' }}

      # ── カットオフ（時間切れ打ち切り）の結果を読む ──────────────
      # 配信スロットに間に合わせるため、間に合わない地本は取得を見送っている。
      # 見送った地本は前回データのままなので公開データは壊れないが、
      # 「毎回どこかを切っている」状態は取り逃しなので気づけるようにする。
      - name: カットオフの結果を確認
        run: |
          echo "STAGE=cutoff_check" >> "$GITHUB_ENV"
          if [ ! -f scraper/cutoff-report.json ]; then
            echo "[カットオフ] レポートなし（打ち切りの仕組みが動いていない可能性）"
            echo "CUTOFF_RESULT=レポートなし" >> "$GITHUB_ENV"
            exit 0
          fi
          HIT=$(node -p "require('./scraper/cutoff-report.json').hit")
          ENABLED=$(node -p "require('./scraper/cutoff-report.json').enabled")
          SKIPPED=$(node -p "require('./scraper/cutoff-report.json').skippedPrefs.map(p=>p.label).join('・')||'なし'")
          COUNT=$(node -p "require('./scraper/cutoff-report.json').skippedPrefs.length")
          if [ "$HIT" = "true" ]; then
            echo "::warning::配信スロットに間に合わせるため ${COUNT} 地本の取得を見送りました（${SKIPPED}）。見送った地本は前回データのままです"
            echo "CUTOFF_RESULT=打ち切りあり（${COUNT} 地本を見送り: ${SKIPPED}）" >> "$GITHUB_ENV"
            curl -sS --fail-with-body --retry 3 --retry-all-errors --connect-timeout 10 --max-time 30 \
              -H "Title: ⏱ スクレイプを時間内で打ち切りました" \
              -H "Tags: hourglass" \
              -H "Priority: default" \
              -H "Content-Type: text/plain; charset=utf-8" \
              -d "配信スロットに間に合わせるため ${COUNT} 地本の取得を見送りました（${SKIPPED}）。見送った地本は前回データのまま公開しています。 https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              "https://ntfy.sh/${{ secrets.NTFY_ADMIN_TOPIC }}" \
              || echo "::warning::管理者通知（カットオフ）の送信に失敗しました（本来の処理には影響しません）"
          elif [ "$ENABLED" = "true" ]; then
            echo "[カットオフ] 期限内に完了（打ち切りなし）"
            echo "CUTOFF_RESULT=期限内に完了" >> "$GITHUB_ENV"
          else
            echo "[カットオフ] 無効（手動実行、または起動が遅く締切を外した回）"
            echo "CUTOFF_RESULT=無効（最後まで実行）" >> "$GITHUB_ENV"
          fi

      # ── データ健全性チェック（スクレイプ成功でも取得結果が異常なら警告）──
      - name: データ健全性チェック
        run: |
          echo "STAGE=health_check" >> "$GITHUB_ENV"
          count_json() { node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const d=JSON.parse(s);let n=0;for(const k of Object.keys(d))if(Array.isArray(d[k]))n+=d[k].length;console.log(n)}catch{console.log(-1)}})"; }
          NEW=$(cat public/data/events.json | count_json)
          OLD=$(git show HEAD:public/data/events.json 2>/dev/null | count_json)
          echo "前回:${OLD} 今回:${NEW}"
          echo "TOTAL_EVENTS=${NEW}" >> "$GITHUB_ENV"
          echo "PREV_EVENTS=${OLD:-0}" >> "$GITHUB_ENV"
          ALERT=""
          if [ "$NEW" -lt 50 ]; then ALERT="総イベント数が異常に少ない（${NEW}件）"; fi
          if [ "${OLD:-0}" -gt 0 ] && [ "$NEW" -lt $((OLD * 60 / 100)) ]; then ALERT="総イベント数が前回比で急減（${OLD}→${NEW}件）"; fi
          if [ -n "$ALERT" ]; then
            echo "::warning::${ALERT}"
            echo "HEALTH_ALERT=${ALERT}" >> "$GITHUB_ENV"
            curl -sS --fail-with-body --retry 3 --retry-all-errors --connect-timeout 10 --max-time 30 \
              -H "Title: ⚠️ データ健全性アラート" \
              -H "Tags: warning" \
              -H "Priority: high" \
              -H "Content-Type: text/plain; charset=utf-8" \
              -d "${ALERT}。スクレイプは成功扱いですが、取得結果に異常の可能性があります。 https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              "https://ntfy.sh/${{ secrets.NTFY_ADMIN_TOPIC }}" \
              || echo "::warning::管理者通知（健全性アラート）の送信に失敗しました（本来の処理には影響しません）"
          fi

      # ── イベント名の品質チェック（表記ゆれ・記載エラーの疑いを警告）──
      - name: イベント名の品質チェック
        run: |
          echo "STAGE=title_check" >> "$GITHUB_ENV"
          if ! OUTPUT=$(node scripts/check-event-titles.mjs); then
            echo "$OUTPUT"
            echo "::warning::イベント名に要確認項目があります"
            WARN=$(printf '%s\n' "$OUTPUT" | grep -ciE "確認|warning|要|⚠" || true)
            echo "TITLE_WARNINGS=${WARN:-0}" >> "$GITHUB_ENV"
            curl -sS --fail-with-body --retry 3 --retry-all-errors --connect-timeout 10 --max-time 30 \
              -H "Title: 📝 イベント名 要確認" \
              -H "Tags: memo" \
              -H "Priority: default" \
              -H "Content-Type: text/plain; charset=utf-8" \
              -d "$(echo "$OUTPUT" | tail -20)" \
              "https://ntfy.sh/${{ secrets.NTFY_ADMIN_TOPIC }}" \
              || echo "::warning::管理者通知（イベント名 要確認）の送信に失敗しました（本来の処理には影響しません）"
          else
            echo "$OUTPUT"
            echo "TITLE_WARNINGS=0" >> "$GITHUB_ENV"
          fi

      # ── 検疫レポート（疑わしいタイトル＝公開保留の管理者通知） ─────────
      # writeOutput が「新種のゴミの可能性が高い」タイトルを公開せず
      # events-quarantine.json へ隔離する。ここでは件数を確認し、あれば通知する。
      # 正規イベントなら shared/titleQuality.cjs の APPROVED_TITLES へ追加で公開される。
      - name: 検疫レポート（公開保留イベントの通知）
        run: |
          QN=$(node -e "try{console.log(require('./public/data/events-quarantine.json').count||0)}catch{console.log(0)}")
          echo "QUARANTINED=${QN}" >> "$GITHUB_ENV"
          if [ "$QN" -gt 0 ]; then
            LIST=$(node -e "const q=require('./public/data/events-quarantine.json');q.events.slice(0,10).forEach(e=>console.log(\`[\${e.pref}] \${e.date} \${e.title}\`))")
            echo "::warning::疑わしいタイトル ${QN} 件を公開保留（検疫）にしました"
            printf '%s\n' "$LIST"
            curl -sS --fail-with-body --retry 3 --retry-all-errors --connect-timeout 10 --max-time 30 \
              -H "Title: 🔒 イベント ${QN} 件を公開保留（検疫）" \
              -H "Tags: lock" \
              -H "Priority: high" \
              -H "Content-Type: text/plain; charset=utf-8" \
              -d "$(printf '%s\n%s' '疑わしいタイトルのため公開を保留しました。正規のイベントなら APPROVED_TITLES への追加で公開されます。' "$LIST")" \
              "https://ntfy.sh/${{ secrets.NTFY_ADMIN_TOPIC }}" \
              || echo "::warning::管理者通知（検疫）の送信に失敗しました（本来の処理には影響しません）"
          else
            echo "検疫対象なし"
          fi

      # ── LLM再検査レポート（一次ソース照合で自動修正された内容の通知） ──
      # 段2でタイトル・開催日が怪しいと判定されたイベントを、段3がチラシ実物を
      # 読み直して修正している。何がどう書き換わったかを管理者が検証できるよう通知する。
      - name: LLM再検査レポート（自動修正の通知）
        run: |
          CN=$(node -e "try{console.log(require('./public/data/events-llm-recheck.json').summary.corrected||0)}catch{console.log(0)}")
          if [ "$CN" -gt 0 ]; then
            LIST=$(node -e "const r=require('./public/data/events-llm-recheck.json');r.corrections.slice(0,10).forEach(c=>console.log(\`[\${c.pref}] \${c.changes.map(x=>\`\${x.field}: \${x.from??'なし'} → \${x.to??'なし'}\`).join(' / ')}\`))")
            echo "::warning::一次ソース再検査により ${CN} 件を自動修正しました"
            printf '%s\n' "$LIST"
            curl -sS --fail-with-body --retry 3 --retry-all-errors --connect-timeout 10 --max-time 30 \
              -H "Title: 🔍 一次ソース再検査で ${CN} 件を自動修正" \
              -H "Tags: mag" \
              -H "Content-Type: text/plain; charset=utf-8" \
              -d "$(printf '%s\n%s' 'チラシ実物を読み直して修正しました。内容は events-llm-recheck.json で確認できます。' "$LIST")" \
              "https://ntfy.sh/${{ secrets.NTFY_ADMIN_TOPIC }}" \
              || echo "::warning::管理者通知（LLM再検査）の送信に失敗しました（本来の処理には影響しません）"
          else
            echo "自動修正なし"
          fi

      # ── データ品質チェック（構造破損・ID重複・不正日付・座標範囲等。エラーでデプロイ停止）──
      - name: データ品質チェック（必須）
        run: |
          echo "STAGE=data_quality" >> "$GITHUB_ENV"
          node scripts/check-data-quality.mjs
          echo "DATA_QUALITY_RESULT=合格" >> "$GITHUB_ENV"

      # ── 変更があればコミット & プッシュ ──────────────────────
      - name: 変更をコミット & プッシュ
        id: commit
        run: |
          echo "STAGE=commit" >> "$GITHUB_ENV"
          git config core.autocrlf false
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # コミット対象を全てステージする。
          # ※ scraper/geocode-cache.json は「コミット対象」の追跡ファイルで、スクレイプ毎に
          #   書き換わる。これを add し忘れると未ステージの追跡変更として残り、後続の
          #   `git rebase` が "cannot rebase: You have unstaged changes" で失敗していた
          #   （2026-06-28 の天気/ジオコーディング機能導入以降、毎回 push 前に停止）。
          git add public/data/events.json public/data/events-quarantine.json public/data/events-llm-recheck.json data/events-archive.json public/events.html public/events/ public/sitemap.xml scraper/geocode-cache.json

          # 変更判定は「ステージ済み差分」で行う（個別ファイル列挙だと archive/quarantine 等の
          # 追加ファイルの検知漏れが起きるため）。デプロイ要否は public/ と data/ の変更で決める
          # （data/events-archive.json は運営APIの関数バンドルへ同梱されるため、更新には
          #   デプロイが必要。geocode-cache 単独の変化はコミットのみ・デプロイなし）。
          STAGED=$(git diff --cached --name-only)

          if [ -z "$STAGED" ]; then
            echo "データに変更がありませんでした。コミットをスキップします。"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "COMMIT_RESULT=変更なし（スキップ）" >> "$GITHUB_ENV"
            echo "PUSH_RESULT=スキップ" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "ステージ済みの変更:"; printf '%s\n' "$STAGED"
          if printf '%s\n' "$STAGED" | grep -qE '^(public/|data/)'; then
            DEPLOY_NEEDED=true
          else
            DEPLOY_NEEDED=false
            echo "public/・data/ 配下の変更なし（geocode-cache のみ）。コミットのみ行いデプロイはスキップします。"
          fi

          if ! git commit -m "chore: update events data [skip ci]"; then
            echo "::error::git commit に失敗しました"
            echo "COMMIT_RESULT=失敗" >> "$GITHUB_ENV"
            exit 1
          fi
          echo "COMMIT_RESULT=成功" >> "$GITHUB_ENV"

          # ── push ─────────────────────────────────────────────────
          # 生成データは常に最新を正とするため rebase 競合は本コミット側を採用(-X theirs)。
          # 失敗原因を区別し、恒久的な拒否（ブランチ保護/権限）は再試行せず即終了、
          # 一時的な通信障害・非fast-forward（他 push との競合）のみ再試行する。
          echo "STAGE=push" >> "$GITHUB_ENV"
          PUSHED=0
          ATTEMPTS=3
          for i in $(seq 1 "$ATTEMPTS"); do
            # fetch: 一時的な通信障害はリトライ対象
            if ! git fetch origin master; then
              echo "::warning::git fetch に失敗（試行 ${i}/${ATTEMPTS}）。通信の一時障害の可能性。再試行します。"
              sleep $((5 * i)); continue
            fi

            # rebase: 未ステージ変更が残っても停止しないよう autostash を有効化（多層防御）
            if ! git -c rebase.autoStash=true rebase -X theirs origin/master; then
              echo "::warning::rebase に失敗（試行 ${i}/${ATTEMPTS}）。中断してやり直します。"
              git rebase --abort 2>/dev/null || true
              sleep $((5 * i)); continue
            fi

            # push: 標準エラーを捕捉して原因を判別（認証情報は出力されない）
            if PUSH_ERR=$(git push origin HEAD:master 2>&1); then
              PUSHED=1; break
            fi
            echo "リモート応答:"; printf '%s\n' "$PUSH_ERR"

            # ブランチ保護 / ルール / 権限による拒否 → 再試行しても解決しないため即終了
            if printf '%s' "$PUSH_ERR" | grep -qiE "protected branch|GH006|push declined|repository rule|required status|not authorized|permission to|denied|403"; then
              echo "::error::ブランチ保護またはルール/権限により push が拒否されました。リトライせず終了します。"
              echo "PUSH_RESULT=拒否（ブランチ保護/ルール/権限）" >> "$GITHUB_ENV"
              exit 1
            fi

            # non-fast-forward（他の push と競合）→ fetch/rebase からやり直し
            if printf '%s' "$PUSH_ERR" | grep -qiE "non-fast-forward|fetch first|rejected|stale info"; then
              echo "::warning::non-fast-forward（他 push と競合。試行 ${i}/${ATTEMPTS}）。fetch/rebase からやり直します。"
              sleep $((5 * i)); continue
            fi

            # それ以外（一時的な通信障害等）→ 再試行
            echo "::warning::push が一時的に失敗（試行 ${i}/${ATTEMPTS}）。再試行します。"
            sleep $((5 * i))
          done

          if [ "$PUSHED" != "1" ]; then
            echo "::error::push に失敗しました（${ATTEMPTS} 回試行）"
            echo "PUSH_RESULT=失敗" >> "$GITHUB_ENV"
            exit 1
          fi
          echo "イベントデータを更新しました。"
          echo "PUSH_RESULT=成功" >> "$GITHUB_ENV"
          # デプロイ・通知は public/ 配下（公開データ）が変わった場合のみ発火させる
          echo "changed=${DEPLOY_NEEDED}" >> "$GITHUB_OUTPUT"

      # ── Vercel に本番デプロイ ─────────────────────────────
      - name: Vercel に本番デプロイ
        if: steps.commit.outputs.changed == 'true'
        # バグ報告の ntfy トピックを実行時環境変数として渡す（deploy.yml と同様）。
        # これがないとスクレイプ起点のデプロイで環境変数が失われ旧トピックに退避する。
        # トークンは別名 env で受け取り改行を除去してから --token に渡す
        # （VERCEL_TOKEN シークレットに改行が混入しており CLI が拒否するため）
        # デプロイは push 済みデータの再実行で冪等なため、一時的な通信断
        # （2026-07-17 の「Error: fetch failed」等）はリトライで吸収する
        run: |
          echo "STAGE=deploy" >> "$GITHUB_ENV"
          CLEAN_TOKEN=$(printf '%s' "$VTOKEN" | tr -d '\r\n')
          ARGS=""
          if [ -n "$NTFY_BUG_TOPIC" ]; then ARGS="$ARGS -e NTFY_BUG_TOPIC=$NTFY_BUG_TOPIC"; fi
          if [ -n "$ADMIN_SECRET" ];   then ARGS="$ARGS -e ADMIN_SECRET=$ADMIN_SECRET"; fi
          if [ -n "$ADMIN_ACCOUNTS_B64" ]; then ARGS="$ARGS -e ADMIN_ACCOUNTS_B64=$ADMIN_ACCOUNTS_B64"; fi
          ATTEMPTS=3
          OK=0
          for i in $(seq 1 "$ATTEMPTS"); do
            if npx vercel --prod --token "$CLEAN_TOKEN" $ARGS; then
              OK=1
              break
            fi
            if [ "$i" -lt "$ATTEMPTS" ]; then
              WAIT=$((i * 60))
              echo "::warning::Vercel デプロイに失敗（試行 ${i}/${ATTEMPTS}）。通信の一時障害の可能性。${WAIT}秒後に再試行します。"
              sleep "$WAIT"
            fi
          done
          if [ "$OK" != "1" ]; then
            echo "::error::Vercel デプロイに失敗しました（${ATTEMPTS} 回試行）"
            echo "DEPLOY_RESULT=失敗" >> "$GITHUB_ENV"
            exit 1
          fi
          echo "DEPLOY_RESULT=成功" >> "$GITHUB_ENV"
        env:
          VTOKEN:            ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          NTFY_BUG_TOPIC:    ${{ secrets.NTFY_BUG_TOPIC }}
          ADMIN_SECRET:      ${{ secrets.ADMIN_SECRET }}
          ADMIN_ACCOUNTS_B64: ${{ secrets.ADMIN_ACCOUNTS_B64 }}

      # ── ntfy.sh でプッシュ通知送信 ────────────────────────
      - name: CDN 伝播待機（Vercel エッジに反映されるまで）
        if: steps.commit.outputs.changed == 'true'
        run: sleep 60

      - name: プッシュ通知を送信
        if: steps.commit.outputs.changed == 'true'
        env:
          SCRAPE_SCHEDULE: ${{ github.event.schedule }}
        run: |
          echo "STAGE=notification" >> "$GITHUB_ENV"
          cat > /tmp/check_notify.js << 'JSEOF'
          'use strict';
          const { execSync } = require('child_process');
          const fs            = require('fs');

          const PREF_TO_REGION = {
            sapporo:'hokkaido', asahikawa:'hokkaido', obihiro:'hokkaido', hakodate:'hokkaido',
            aomori:'tohoku', iwate:'tohoku', miyagi:'tohoku', akita:'tohoku', yamagata:'tohoku', fukushima:'tohoku',
            kanagawa:'kanto', tokyo:'kanto', saitama:'kanto', gunma:'kanto', tochigi:'kanto', ibaraki:'kanto', chiba:'kanto',
            niigata:'chubu', toyama:'chubu', ishikawa:'chubu', fukui:'chubu', yamanashi:'chubu', nagano:'chubu', gifu:'chubu', shizuoka:'chubu', aichi:'chubu',
            mie:'kinki', shiga:'kinki', kyoto:'kinki', osaka:'kinki', hyogo:'kinki', nara:'kinki', wakayama:'kinki',
            tokushima:'shikoku', kagawa:'shikoku', ehime:'shikoku', kochi:'shikoku',
            tottori:'chugoku', shimane:'chugoku', okayama:'chugoku', hiroshima:'chugoku', yamaguchi:'chugoku',
            fukuoka:'kyushu', saga:'kyushu', nagasaki:'kyushu', kumamoto:'kyushu', oita:'kyushu', miyazaki:'kyushu', kagoshima:'kyushu', okinawa:'kyushu',
          };
          const REGION_LABELS = {
            hokkaido:'北海道', tohoku:'東北', kanto:'関東', chubu:'中部',
            kinki:'近畿', chugoku:'中国', shikoku:'四国', kyushu:'九州・沖縄',
          };

          const curr = JSON.parse(fs.readFileSync('./public/data/events.json', 'utf8'));

          let prev = { updatedAt: null };
          try {
            const raw = execSync('git show HEAD~1:public/data/events.json').toString();
            prev = JSON.parse(raw);
          } catch {
            console.log('[通知] 前回データなし（初回コミット）');
          }

          console.log('[通知判定]');
          console.log('  前回 updatedAt :', prev.updatedAt ?? '(なし)');
          console.log('  今回 updatedAt :', curr.updatedAt);

          if (prev.updatedAt && prev.updatedAt === curr.updatedAt) {
            console.log('  → スキップ: updatedAt 変化なし');
            process.exit(0);
          }

          const ALL_PREFS = Object.keys(curr).filter(k => Array.isArray(curr[k]));
          const prevIds   = new Set(ALL_PREFS.flatMap(p => (prev[p] || []).map(e => e.id)));
          const newItems  = ALL_PREFS.flatMap(p =>
            (curr[p] || []).filter(e =>
              !prevIds.has(e.id) && e.source_type !== 'office_notice'
            ).map(e => ({ ...e, _pref: p }))
          );

          console.log('  全イベント数 :', ALL_PREFS.flatMap(p => curr[p] || []).length, '件');
          console.log('  新着件数     :', newItems.length, '件');
          newItems.forEach(e => console.log('    新着:', e._pref, e.id, e.title));

          if (newItems.length === 0) {
            console.log('  → スキップ: 新着イベントなし');
            process.exit(0);
          }

          // 地区別にグループ化
          const byRegion = {};
          for (const e of newItems) {
            const region = PREF_TO_REGION[e._pref] || 'other';
            if (!byRegion[region]) byRegion[region] = [];
            byRegion[region].push(e);
          }

          const regionNames = Object.keys(byRegion)
            .map(r => REGION_LABELS[r] || r)
            .join('・');

          fs.writeFileSync('/tmp/notify_data.json', JSON.stringify({
            total: newItems.length,
            regionNames,
            byRegion: Object.fromEntries(
              Object.entries(byRegion).map(([r, evs]) => [r, {
                label: REGION_LABELS[r] || r,
                count: evs.length,
                sample: evs[0].title,
              }])
            ),
          }));
          JSEOF

          node /tmp/check_notify.js

          if [ -f /tmp/notify_data.json ]; then
            # ── 通知を必ず 08:00 / 12:00 / 18:00(JST) スロットで送る ──
            # スクレイプが早く終わっても、トリガー元 cron に対応する目標スロットまで
            # 待ってから送信する。GitHub 起動が遅延し既にスロットを過ぎている場合
            # （WAIT<=0）や、想定外に遠い場合（>3h）は待たず即送信。手動実行も即送信。
            #   cron とスロットの対応は shared/scrapeDeadline.cjs が唯一の出どころ。
            #   ここに手書きの対応表を置くと cron を変えたときにズレて待機が効かなくなる
            #   （実際にそうなり、通知が 09:32 のような中途半端な時刻に出ていた）。
            #   TZ非依存で確実にするため UTC の epoch で受け取る。
            TARGET_EPOCH=$(node -e "
              const { slotForSchedule, slotTargetEpoch } = require('./shared/scrapeDeadline.cjs');
              const slot = slotForSchedule(process.env.SCRAPE_SCHEDULE || '');
              process.stdout.write(slot ? String(Math.floor(slotTargetEpoch(slot, Date.now()) / 1000)) : '');
            ")
            if [ -n "$TARGET_EPOCH" ]; then
              TARGET_UTC=$(date -u -d "@${TARGET_EPOCH}" +%H:%M)
              WAIT=$(( TARGET_EPOCH - $(date -u +%s) ))
              if [ "$WAIT" -gt 0 ] && [ "$WAIT" -le 10800 ]; then
                echo "[通知] 目標スロット(UTC ${TARGET_UTC}) まで ${WAIT}s 待機してから送信します"
                sleep "$WAIT"
              elif [ "$WAIT" -le 0 ]; then
                # 起動遅延でスロットを過ぎた。次のスロットまでは4〜14時間あり待てないため
                # 即時送信するが、定刻を外したことが分かるよう警告に残す。
                echo "::warning::目標スロット(UTC ${TARGET_UTC} / JST $(date -u -d "@$(( TARGET_EPOCH + 32400 ))" +%H:%M)) を $(( -WAIT / 60 ))分 過ぎたため即時送信します（GitHub のスケジュール起動遅延）"
                echo "[通知] 待機なしで即送信（WAIT=${WAIT}s）"
                OFF_SLOT=1
              else
                echo "[通知] 待機なしで即送信（WAIT=${WAIT}s＝想定外に遠いスロット）"
              fi
            fi

            TOTAL=$(node -p "require('/tmp/notify_data.json').total")
            REGION_NAMES=$(node -p "require('/tmp/notify_data.json').regionNames")

            # 全地区トピックへ送信（push/deploy は成功済み。通知の一時失敗で
            # ジョブ全体を失敗させ誤った失敗メールを出さないよう、失敗は警告に留める）
            NOTIFY_WARN=0
            curl -sS --retry 3 --retry-all-errors --connect-timeout 10 --max-time 30 \
              -H "Title: 自衛隊地本イベント情報 新着" \
              -H "Tags: mega,jp" \
              -H "Priority: default" \
              -d "新着イベントが${TOTAL}件追加されました（${REGION_NAMES}）。アプリを確認してください。" \
              "https://ntfy.sh/${{ secrets.NTFY_TOPIC }}" \
              && echo "[通知] 全地区送信完了（新着 ${TOTAL}件 / ${REGION_NAMES}）" \
              || { NOTIFY_WARN=1; echo "::warning::全地区への新着通知の送信に失敗しました（データ更新自体は成功しています）"; }

            # 地区別トピックへ送信
            node -e "
              const d = require('/tmp/notify_data.json');
              for (const [id, r] of Object.entries(d.byRegion)) {
                process.stdout.write(id + '\t' + r.label + '\t' + r.count + '\t' + r.sample + '\n');
              }
            " | while IFS=$'\t' read -r REGION_ID REGION_LABEL COUNT SAMPLE; do
              curl -sS --retry 3 --retry-all-errors --connect-timeout 10 --max-time 30 \
                -H "Title: 自衛隊地本イベント情報 新着（${REGION_LABEL}）" \
                -H "Tags: mega,jp" \
                -H "Priority: default" \
                -d "${REGION_LABEL}に新着${COUNT}件（${SAMPLE}）追加されました。" \
                "https://ntfy.sh/${{ secrets.NTFY_TOPIC }}-${REGION_ID}" \
                && echo "[通知] ${REGION_LABEL}送信完了（${COUNT}件）" \
                || echo "::warning::${REGION_LABEL}への新着通知の送信に失敗しました（データ更新自体は成功しています）"
            done
            if [ "${NOTIFY_WARN:-0}" = "1" ]; then
              echo "NOTIFY_RESULT=一部送信失敗（警告。新着 ${TOTAL}件）" >> "$GITHUB_ENV"
            else
              echo "NOTIFY_RESULT=送信済み（新着 ${TOTAL}件）${OFF_SLOT:+ ※定刻外}" >> "$GITHUB_ENV"
            fi
          else
            echo "[通知] 送信スキップ"
            echo "NOTIFY_RESULT=新着なし（スキップ）" >> "$GITHUB_ENV"
          fi

      # ── Web Push 送信（アプリを閉じていても届く購読者向け） ────────────
      # 送信タイミングは commit → push → Vercel デプロイ → CDN 伝播待機 → ntfy
      # スロット待機の「後」（このステップ位置）。以前はスクレイプ中に送信しており、
      # 通知タップ時にまだ旧データが CDN に載っている問題があった（Issue #16 解消）。
      # ペイロードは scraper が push-payload.json に書き出し済み（新着0なら count:0）。
      - name: Web Push を送信（デプロイ反映後）
        if: steps.commit.outputs.changed == 'true'
        run: |
          if [ ! -f scraper/push-payload.json ]; then
            echo "[WebPush] ペイロードなし。スキップ"; exit 0
          fi
          CNT=$(node -p "try{require('./scraper/push-payload.json').count||0}catch{0}")
          if [ "$CNT" -le 0 ]; then
            echo "[WebPush] 新着0件。スキップ"; exit 0
          fi
          echo "[WebPush] 新着 ${CNT} 件を購読者へ送信します（デプロイ反映後）"
          BODY=$(node -e "const p=require('./scraper/push-payload.json');process.stdout.write(JSON.stringify({title:p.title,body:p.body,url:p.url||'/'}))")
          curl -sS --retry 3 --retry-all-errors --connect-timeout 10 --max-time 30 \
            -X POST \
            -H "Content-Type: application/json" \
            -H "x-notify-secret: ${{ secrets.NOTIFY_SECRET }}" \
            -d "$BODY" \
            "${{ secrets.SITE_URL }}/api/notify" \
            && echo "[WebPush] 送信完了" \
            || echo "::warning::Web Push の送信に失敗しました（データ更新自体は成功しています）"

      # ── 失敗段階を特定して管理者に通知 ──────────────────────
      # 一律の「スクレイピング失敗」ではなく、実際に停止した段階を表示する。
      - name: 失敗を管理者に通知
        if: failure()
        run: |
          case "${STAGE:-unknown}" in
            smoke)         LABEL="スクレイパー スモークテスト失敗（コード不備の可能性）" ;;
            scrape)        LABEL="データ取得失敗" ;;
            health_check)  LABEL="データ健全性チェック失敗" ;;
            title_check)   LABEL="イベント名チェック失敗" ;;
            data_quality)  LABEL="必須データ品質チェック失敗" ;;
            commit)        LABEL="Git commit失敗" ;;
            push)          LABEL="GitHub push失敗" ;;
            deploy)        LABEL="Vercel deploy失敗" ;;
            notification)  LABEL="通知配信の警告/失敗" ;;
            *)             LABEL="不明な段階での失敗" ;;
          esac
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "::error::失敗段階: ${STAGE:-unknown}（${LABEL}）"
          curl -sS --fail-with-body --retry 3 --retry-all-errors --connect-timeout 10 --max-time 30 \
            -H "Title: ⚠️ 自動更新ジョブ失敗: ${LABEL}" \
            -H "Tags: warning" \
            -H "Priority: high" \
            -H "Content-Type: text/plain; charset=utf-8" \
            -d "自動更新ジョブが「${LABEL}」段階で失敗しました（stage=${STAGE:-unknown}）。ログを確認してください。 ${RUN_URL}" \
            "https://ntfy.sh/${{ secrets.NTFY_ADMIN_TOPIC }}" \
            || echo "::warning::管理者への失敗通知の送信に失敗しました（元の障害原因は上記 stage を参照）"

      # ── 実行サマリを $GITHUB_STEP_SUMMARY に出力（成功/失敗いずれも） ──
      - name: 実行サマリを出力
        if: always()
        run: |
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ "${{ job.status }}" = "success" ]; then
            FINAL="✅ 成功"
          else
            FINAL="❌ 失敗（最終段階: ${STAGE:-unknown}）"
          fi
          {
            echo "## スクレイピング & データ更新 実行サマリ"
            echo ""
            echo "| 項目 | 結果 |"
            echo "| --- | --- |"
            echo "| スクレイピング | ${TOTAL_EVENTS:+成功（${TOTAL_EVENTS} 件取得）}${TOTAL_EVENTS:-未到達 or 失敗} |"
            echo "| イベント総数 | ${TOTAL_EVENTS:-N/A} 件（前回 ${PREV_EVENTS:-N/A} 件） |"
            echo "| カットオフ | ${CUTOFF_RESULT:-未実行} |"
            echo "| データ健全性 | ${HEALTH_ALERT:-異常なし} |"
            echo "| 品質警告数（イベント名） | ${TITLE_WARNINGS:-0} 件 |"
            echo "| 検疫（公開保留） | ${QUARANTINED:-0} 件 |"
            echo "| 必須品質チェック | ${DATA_QUALITY_RESULT:-未実行/失敗} |"
            echo "| commit | ${COMMIT_RESULT:-未実行} |"
            echo "| push | ${PUSH_RESULT:-未実行} |"
            echo "| deploy | ${DEPLOY_RESULT:-スキップ/未実行} |"
            echo "| 通知 | ${NOTIFY_RESULT:-スキップ/未実行} |"
            echo "| **最終ステータス** | **${FINAL}** |"
            echo ""
            echo "対象 Run: ${RUN_URL}"
          } >> "$GITHUB_STEP_SUMMARY"
