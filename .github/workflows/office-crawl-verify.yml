name: 募集窓口の取得修正を再確認
on:
  push:
    branches: [master]
    paths:
      - 'scraper/config/office-source-recovery.json'
      - 'scripts/verify-office-crawl.cjs'
      - '.github/workflows/office-crawl-verify.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: office-crawl-verification
  cancel-in-progress: false
jobs:
  verify:
    # ubuntu-latest は 2026-10-31 から Ubuntu 26.04 になり、Playwright 1.59 が非対応で
    # 「Playwright does not support chromium on ubuntu26.04-x64」で毎回失敗した。対応版が出るまで固定する
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: npm ci
        working-directory: scraper
      - run: python -m pip install -r scraper/requirements-ocr.txt
      - uses: actions/cache/restore@v5
        with:
          path: scraper/ocr-cache.json
          key: office-verify-${{ github.run_id }}
          restore-keys: |
            ocr-cache-${{ runner.os }}-
      # apt の障害で落ちないよう共通アクションを使う（scrape.yml と同じ。2026-11-11 のミラー障害の再発防止）
      - uses: ./.github/actions/install-ocr-packages
        continue-on-error: true
        timeout-minutes: 8
      - uses: ./.github/actions/install-playwright-chromium
        timeout-minutes: 12
        with:
          working-directory: scraper
      - name: HTML・OCRの限定再確認（イベント保存・通知なし）
        run: node scripts/verify-office-crawl.cjs
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OCR_SPACE_API_KEY: ${{ secrets.OCR_SPACE_API_KEY }}
      - uses: actions/cache/save@v5
        if: always()
        with:
          path: scraper/ocr-cache.json
          key: ocr-cache-${{ runner.os }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: office-crawl-verification-${{ github.run_id }}
          path: scraper/office-crawl-verification.json
          retention-days: 14
