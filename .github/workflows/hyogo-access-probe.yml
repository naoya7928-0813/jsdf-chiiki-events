name: 兵庫低負荷アクセス確認

on:
  push:
    branches:
      - test/hyogo-low-load-access
    paths:
      - '.github/workflows/hyogo-access-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - working-directory: scraper
        run: npm ci
      - working-directory: scraper
        run: npx playwright install chromium --with-deps
      - name: 西宮地域事務所を軽量ブラウザで1回だけ確認
        working-directory: scraper
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const url = 'https://www.mod.go.jp/pco/hyogo/jimusyo/nishinomiya.html';
            const browser = await chromium.launch({ headless: true });
            try {
              const ctx = await browser.newContext({ locale: 'ja-JP', timezoneId: 'Asia/Tokyo' });
              await ctx.route('**/*', route => {
                const t = route.request().resourceType();
                if (['image','stylesheet','font','media'].includes(t)) return route.abort();
                return route.continue();
              });
              const page = await ctx.newPage();
              const started = Date.now();
              const res = await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 20000 });
              await page.waitForTimeout(5000);
              const title = await page.title();
              const text = await page.locator('body').innerText().catch(() => '');
              console.log(JSON.stringify({
                label: 'office-light-browser',
                status: res?.status() ?? null,
                ms: Date.now() - started,
                title: title.slice(0,80),
                hasEvent: /陸上自衛隊高等工科学校説明会|自衛隊職業説明会/.test(text),
                bodyChars: text.length,
              }));
              await ctx.close();
            } finally {
              await browser.close();
            }
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
