name: 兵庫パーサー変更後の再取得

on:
  # 兵庫の専用パーサーを変更したときは、コード反映だけで終わらせず
  # 実サイトからフルスクレイプ＋OCR＋募集窓口巡回まで一度通す。
  push:
    branches:
      - master
    paths:
      - 'scraper/parsers/hyogo.js'

concurrency:
  group: hyogo-parser-rescrape
  cancel-in-progress: true

jobs:
  dispatch:
    name: 兵庫を優先して本番スクレイプを起動
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: フルスクレイプ＋OCRを通知なしで起動
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run scrape.yml --ref master \
            -f hq_explore_prefs=hyogo \
            -f source_update_mode=true
