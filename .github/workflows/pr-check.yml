name: PR Check

# master 向け Pull Request の検証のみを行う。
# デプロイ・スクレイピング・データコミット・通知送信は一切行わない。
on:
  pull_request:
    branches:
      - master

# 必要最小限の権限（読み取りのみ）
permissions:
  contents: read

jobs:
  check:
    name: テスト・ビルド・品質・監査
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v5

      - name: Node.js 22 をセットアップ
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: 依存パッケージをインストール
        run: npm ci

      - name: テスト
        run: npm test

      # ルート依存だけでは cheerio が無く、実HTMLパーサー回帰テストが
      # skip されるため、スクレイパー側の依存を入れて明示的に実行する。
      - name: scraper の依存パッケージをインストール
        working-directory: scraper
        run: npm ci

      - name: スクレイパー構文チェック
        run: node --check scraper/index.js

      - name: 実HTMLパーサー回帰テスト
        run: node --test shared/yamanashiParser.test.cjs shared/hyogoParser.test.cjs shared/hokkaidoHyogoRegression.test.cjs shared/tokyoCalendar.test.cjs

      - name: ビルド
        run: npm run build

      - name: データ品質チェック
        run: node scripts/check-data-quality.mjs

      - name: 依存関係の脆弱性監査（本番依存のみ）
        run: npm audit --omit=dev
