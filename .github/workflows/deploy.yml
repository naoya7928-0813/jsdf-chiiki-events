name: フロントエンド デプロイ

on:
  # master へのプッシュで自動実行（スクレイパー由来のコミットは除外）
  push:
    branches:
      - master
    paths:
      - 'src/**'
      - 'public/**'
      - 'api/**'
      - 'scripts/**'
      - 'index.html'
      - 'vite.config.js'
      - 'vercel.json'
      - 'package.json'
      - 'package-lock.json'

  # GitHub Actions UI から手動実行も可能
  workflow_dispatch:

jobs:
  deploy:
    name: Vercel 本番デプロイ
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Node.js 22 をセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 依存パッケージをインストール
        run: npm ci

      - name: Vercel に本番デプロイ
        # バグ報告の ntfy トピックは GitHub Secret から実行時環境変数として渡す
        # （リポジトリ・バンドルに出さない）。未設定なら api/report.js が旧トピックに退避。
        # VERCEL_TOKEN は env 経由で渡す（インライン展開は末尾改行で壊れるため）
        run: |
          ARGS=""
          if [ -n "$NTFY_BUG_TOPIC" ]; then ARGS="-e NTFY_BUG_TOPIC=$NTFY_BUG_TOPIC"; fi
          npx vercel --prod $ARGS
        env:
          VERCEL_TOKEN:      ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          NTFY_BUG_TOPIC:    ${{ secrets.NTFY_BUG_TOPIC }}
