name: フロントエンド デプロイ

on:
  # master へのプッシュで自動実行（スクレイパー由来のコミットは除外）
  push:
    branches:
      - master
    paths:
      - 'src/**'
      # フロントは shared/*.cjs を直接 import している（branch/weather/titleQuality/
      # officeTitle/brandColors、bootTheme は vite.config 経由）。ここが無いと
      # shared だけ直したときにサイトへ反映されない
      - 'shared/**'
      - 'public/**'
      # 恒久アーカイブ（public/ の外・運営APIの関数バンドルへ同梱）。更新にはデプロイが必要
      - 'data/**'
      - 'api/**'
      - 'scripts/**'
      - 'index.html'
      - 'vite.config.js'
      # イベント個別URLのOGP注入（Edge Middleware）。デプロイしないと反映されない
      - 'middleware.js'
      - 'vercel.json'
      - 'package.json'
      - 'package-lock.json'

  # GitHub Actions UI から手動実行も可能
  workflow_dispatch:

jobs:
  deploy:
    name: Vercel 本番デプロイ
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v5

      - name: Node.js 22 をセットアップ
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: 依存パッケージをインストール
        run: npm ci

      # テスト・ビルド・データ品質チェックが成功した場合のみデプロイする
      - name: テスト
        run: npm test

      # SITE_URL（シークレット）はコードの既定より優先される。移行後に古い値が
      # 残っていると canonical・OGP・sitemap が旧ドメインで生成されるため先に止める。
      - name: 公開URLの確認
        run: node scripts/check-site-url.mjs
        env:
          SITE_URL: ${{ secrets.SITE_URL }}

      - name: ビルド（デプロイ前ゲート）
        # canonical / OGP / sitemap / 静的ページのドメイン。未設定なら
        # shared/siteUrl.cjs の DEFAULT_SITE_URL が使われる
        run: npm run build
        env:
          SITE_URL: ${{ secrets.SITE_URL }}

      - name: データ品質チェック（エラーでデプロイ停止）
        run: node scripts/check-data-quality.mjs

      - name: Vercel に本番デプロイ
        # バグ報告の ntfy トピックは GitHub Secret から実行時環境変数として渡す
        # （リポジトリ・バンドルに出さない）。未設定なら api/report.js が旧トピックに退避。
        # トークンは別名 env で受け取り改行を除去してから --token に渡す
        # （VERCEL_TOKEN シークレットに改行が混入しており CLI が拒否するため）
        # デプロイは同一コミットの再実行で冪等なため、一時的な通信断はリトライで吸収する
        run: |
          CLEAN_TOKEN=$(printf '%s' "$VTOKEN" | tr -d '\r\n')
          ARGS=""
          if [ -n "$NTFY_BUG_TOPIC" ]; then ARGS="$ARGS -e NTFY_BUG_TOPIC=$NTFY_BUG_TOPIC"; fi
          if [ -n "$ADMIN_SECRET" ];   then ARGS="$ARGS -e ADMIN_SECRET=$ADMIN_SECRET"; fi
          if [ -n "$ADMIN_ACCOUNTS_B64" ]; then ARGS="$ARGS -e ADMIN_ACCOUNTS_B64=$ADMIN_ACCOUNTS_B64"; fi
          ATTEMPTS=3
          OK=0
          for i in $(seq 1 "$ATTEMPTS"); do
            if npx vercel --prod --token "$CLEAN_TOKEN" $ARGS; then
              OK=1
              break
            fi
            if [ "$i" -lt "$ATTEMPTS" ]; then
              WAIT=$((i * 60))
              echo "::warning::Vercel デプロイに失敗（試行 ${i}/${ATTEMPTS}）。通信の一時障害の可能性。${WAIT}秒後に再試行します。"
              sleep "$WAIT"
            fi
          done
          if [ "$OK" != "1" ]; then
            echo "::error::Vercel デプロイに失敗しました（${ATTEMPTS} 回試行）"
            exit 1
          fi
        env:
          VTOKEN:            ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          NTFY_BUG_TOPIC:    ${{ secrets.NTFY_BUG_TOPIC }}
          ADMIN_SECRET:      ${{ secrets.ADMIN_SECRET }}
          ADMIN_ACCOUNTS_B64: ${{ secrets.ADMIN_ACCOUNTS_B64 }}

      - name: IndexNow へURL送信（Bing/Yandex等。Google非対応はsitemap巡回）
        # 本番反映後にキーファイルが公開されている前提で送信。失敗してもデプロイは成功扱い。
        continue-on-error: true
        run: |
          sleep 20
          node scripts/indexnow.mjs
        env:
          # 送信先ホスト。未設定なら shared/siteUrl.cjs の既定ドメイン
          SITE_URL: ${{ secrets.SITE_URL }}
