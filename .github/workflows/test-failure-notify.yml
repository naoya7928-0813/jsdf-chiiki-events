name: 失敗通知テスト（削除予定）

on:
  workflow_dispatch:

jobs:
  test-fail:
    name: 失敗通知テスト
    runs-on: ubuntu-latest

    steps:
      - name: 意図的に失敗させる
        run: exit 1

      - name: スクレイプ失敗を管理者に通知
        if: failure()
        run: |
          curl -s \
            -H "Title: ⚠️ スクレイピング失敗" \
            -H "Tags: warning" \
            -H "Priority: high" \
            -H "Content-Type: text/plain; charset=utf-8" \
            -d "スクレイピングジョブが失敗しました。GitHub Actions のログを確認してください。 https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            https://ntfy.sh/${{ secrets.NTFY_ADMIN_TOPIC }}
